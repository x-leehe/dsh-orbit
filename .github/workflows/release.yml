name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 发版门禁：CHANGELOG.md 里必须有这个 tag 的条目，否则这一步失败，后面一步都不会跑。
      - name: Changelog gate
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          Write-Host "tag = $tag"
          pwsh -NoProfile -File tools/changelog.ps1 -Version $tag -Out release-body.md
          Add-Content -Path release-body.md -Value "`n---`n"
          Get-Content .github/release-footer.md -Raw | Add-Content -Path release-body.md
          Write-Host "----- release body -----"
          Get-Content release-body.md

      - name: Publish (self-contained single file)
        run: |
          dotnet publish DshOrbit.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist
          Remove-Item dist\*.xml -Force -ErrorAction SilentlyContinue

      - name: Publish (framework-dependent)
        run: |
          dotnet publish DshOrbit.csproj -c Release -o dist-lite
          Remove-Item dist-lite\*.xml -Force -ErrorAction SilentlyContinue

      - name: Build installer (embeds the self-contained build)
        run: |
          $payload = Get-Item dist\DSH-Orbit.exe
          if ($payload.Length -lt 10MB) { throw "安装器 payload 必须自带运行时，实际 $($payload.Length) 字节" }
          dotnet publish installer/Setup.csproj -c Release -o setup-dist

      - name: Rename assets
        run: |
          Move-Item dist\DSH-Orbit.exe DSH-Orbit.exe -Force
          Move-Item dist-lite\DSH-Orbit.exe DSH-Orbit-lite.exe -Force
          Move-Item setup-dist\DSH-Orbit-Setup.exe DSH-Orbit-Setup.exe -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DSH-Orbit ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-body.md
          files: |
            DSH-Orbit-Setup.exe
            DSH-Orbit.exe
            DSH-Orbit-lite.exe
          fail_on_unmatched_files: true
