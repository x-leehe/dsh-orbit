name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained single file)
        run: |
          dotnet publish DshOrbit.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist
          Remove-Item dist\*.xml -Force -ErrorAction SilentlyContinue

      - name: Publish (framework-dependent)
        run: |
          dotnet publish DshOrbit.csproj -c Release -o dist-lite
          Remove-Item dist-lite\*.xml -Force -ErrorAction SilentlyContinue

      - name: Rename assets
        run: |
          Move-Item dist\DSH-Orbit.exe DSH-Orbit.exe -Force
          Move-Item dist-lite\DSH-Orbit.exe DSH-Orbit-lite.exe -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DSH-Orbit ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            由 GitHub Actions 自动构建。

            - `DSH-Orbit.exe`：自带 .NET 运行时（~47 MB）
            - `DSH-Orbit-lite.exe`：需要 .NET 10 桌面运行时（~1.4 MB）

            两者都需要系统已安装 WebView2 运行时。

            > 本项目为 AIGC（AI 生成内容），使用前请自行评估风险。
          files: |
            DSH-Orbit.exe
            DSH-Orbit-lite.exe
          fail_on_unmatched_files: true
