name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained single file)
        run: |
          dotnet publish DshOrbit.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist
          Remove-Item dist\*.xml -Force -ErrorAction SilentlyContinue

      - name: Publish (framework-dependent)
        run: |
          dotnet publish DshOrbit.csproj -c Release -o dist-lite
          Remove-Item dist-lite\*.xml -Force -ErrorAction SilentlyContinue

      - name: Build installer (embeds the self-contained build)
        run: |
          $payload = Get-Item dist\DSH-Orbit.exe
          if ($payload.Length -lt 10MB) { throw "安装器 payload 必须自带运行时" }
          dotnet publish installer/Setup.csproj -c Release -o setup-dist -p:PayloadPath=dist\DSH-Orbit.exe

      - name: Rename assets
        run: |
          Move-Item dist\DSH-Orbit.exe DSH-Orbit.exe -Force
          Move-Item dist-lite\DSH-Orbit.exe DSH-Orbit-lite.exe -Force
          Move-Item setup-dist\DSH-Orbit-Setup.exe DSH-Orbit-Setup.exe -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DSH-Orbit ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            由 GitHub Actions 自动构建。

            - `DSH-Orbit-Setup.exe`：**推荐**。7-Zip 风格的安装器，可选安装位置、快捷方式、开始菜单，写「应用和功能」卸载项；**不需要预装 .NET**（内部是自带运行时的版本）
            - `DSH-Orbit.exe`：绿色单文件，自带 .NET 运行时（~47 MB）
            - `DSH-Orbit-lite.exe`：最小体积，需要 .NET 10 桌面运行时（~1.5 MB）

            三者都还需要系统装有 WebView2 运行时（Win10/11 一般自带）。

            > 本项目为 AIGC（AI 生成内容），使用前请自行评估风险。
          files: |
            DSH-Orbit-Setup.exe
            DSH-Orbit.exe
            DSH-Orbit-lite.exe
          fail_on_unmatched_files: true
