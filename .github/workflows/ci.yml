name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DshOrbit.csproj

      - name: Build
        run: dotnet build DshOrbit.csproj -c Release --no-restore

      - name: Publish (framework-dependent)
        run: |
          dotnet publish DshOrbit.csproj -c Release -o dist-lite
          Remove-Item dist-lite\*.xml -Force -ErrorAction SilentlyContinue

      - name: Publish (self-contained single file)
        run: |
          dotnet publish DshOrbit.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist
          Remove-Item dist\*.xml -Force -ErrorAction SilentlyContinue

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Orbit-lite
          path: dist-lite/DSH-Orbit.exe

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Orbit-portable
          path: dist/DSH-Orbit.exe
